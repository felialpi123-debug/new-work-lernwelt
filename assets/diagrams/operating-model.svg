<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><style>text{font-family:Manrope,Arial,sans-serif}</style><rect width="900" height="320" rx="20" fill="#fff"/><text x="30" y="49" font-size="26" font-weight="700" fill="#123149">Vom Problem zur Entscheidung</text><rect x="30" y="84" width="271" height="204" rx="16" fill="#e8f2f3"/><text x="48" y="120" font-size="22" font-weight="700" fill="#18354b">Beobachten</text><text x="48" y="161" font-size="17" fill="#294355">Wo stockt es?</text><text x="48" y="192" font-size="17" fill="#294355">Wer ist betroffen?</text><rect x="315" y="84" width="271" height="204" rx="16" fill="#eaf0fc"/><text x="333" y="120" font-size="22" font-weight="700" fill="#18354b">Festlegen</text><text x="333" y="161" font-size="17" fill="#294355">Wer entscheidet?</text><text x="333" y="192" font-size="17" fill="#294355">Welche Grenzen?</text><rect x="599" y="84" width="271" height="204" rx="16" fill="#f4ecfa"/><text x="617" y="120" font-size="22" font-weight="700" fill="#18354b">Überprüfen</text><text x="617" y="161" font-size="17" fill="#294355">Was funktioniert?</text><text x="617" y="192" font-size="17" fill="#294355">Was wird angepasst?</text></svg>