<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img"><title>Purpose als Entscheidungskompass</title><rect width="1000" height="525" rx="25" fill="#edf4ef"/><text x="45" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#173c32">Purpose als Entscheidungskompass</text><rect x="35" y="100" width="930" height="110" rx="15" fill="white" stroke="#a9cbbc"/><text x="60" y="135" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#245e4a">SINN</text><text x="60" y="169" font-family="Arial,sans-serif" font-size="23" fill="#29473e">Welchen sinnvollen Beitrag leisten wir?</text><rect x="35" y="225" width="930" height="110" rx="15" fill="white" stroke="#a9cbbc"/><text x="60" y="260" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#245e4a">ZWECK</text><text x="60" y="294" font-family="Arial,sans-serif" font-size="23" fill="#29473e">Für wen schaffen wir Nutzen?</text><rect x="35" y="350" width="930" height="110" rx="15" fill="white" stroke="#a9cbbc"/><text x="60" y="385" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#245e4a">ORIENTIERUNG</text><text x="60" y="419" font-family="Arial,sans-serif" font-size="23" fill="#29473e">Welche Entscheidung folgt daraus?</text><text x="45" y="507" font-family="Arial,sans-serif" font-size="17" fill="#557267">Schematische Lehrgrafik · didaktisch vereinfacht</text></svg>